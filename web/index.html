<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CNC Machining Calculator | Li Lu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CNC Machining Calculator</h1>
        <p>Engineering tools for CNC machining and process development</p>
    </header>


    <main>

        <section class="calculator-card">

            <h2>Spindle Speed</h2>

            <div class="input-group">
                <label for="diameter">Diameter (mm)</label>
                <input
                    type="number"
                    id="diameter"
                    placeholder="Example: 100"
                >
            </div>

            <div class="input-group">
                <label for="cuttingSpeed">Cutting Speed (m/min)</label>
                <input
                    type="number"
                    id="cuttingSpeed"
                    placeholder="Example: 150"
                >
            </div>

            <button onclick="calculateSpindleSpeed()">
                Calculate
            </button>

            <div class="result">
                <span>Spindle Speed:</span>
                <strong id="spindleResult">---</strong>
            </div>

        </section>


        <section class="calculator-card">

            <h2>Feed Rate</h2>

            <div class="input-group">
                <label for="feedPerTooth">Feed per Tooth (mm/tooth)</label>
                <input
                    type="number"
                    id="feedPerTooth"
                    placeholder="Example: 0.10"
                >
            </div>

            <div class="input-group">
                <label for="numberOfTeeth">Number of Teeth</label>
                <input
                    type="number"
                    id="numberOfTeeth"
                    placeholder="Example: 4"
                >
            </div>

            <div class="input-group">
                <label for="feedSpindleSpeed">Spindle Speed (RPM)</label>
                <input
                    type="number"
                    id="feedSpindleSpeed"
                    placeholder="Example: 800"
                >
            </div>

            <button onclick="calculateFeedRate()">
                Calculate
            </button>

            <div class="result">
                <span>Feed Rate:</span>
                <strong id="feedResult">---</strong>
            </div>

        </section>


        <section class="calculator-card">

            <h2>Cutting Speed</h2>

            <div class="input-group">
                <label for="cuttingDiameter">Diameter (mm)</label>
                <input
                    type="number"
                    id="cuttingDiameter"
                    placeholder="Example: 100"
                >
            </div>

            <div class="input-group">
                <label for="cuttingSpindleSpeed">Spindle Speed (RPM)</label>
                <input
                    type="number"
                    id="cuttingSpindleSpeed"
                    placeholder="Example: 800"
                >
            </div>

            <button onclick="calculateCuttingSpeed()">
                Calculate
            </button>

            <div class="result">
                <span>Cutting Speed:</span>
                <strong id="cuttingResult">---</strong>
            </div>

        </section>


        <section class="calculator-card">

            <h2>Material Removal Rate</h2>

            <div class="input-group">
                <label for="widthOfCut">Width of Cut (mm)</label>
                <input
                    type="number"
                    id="widthOfCut"
                    placeholder="Example: 10"
                >
            </div>

            <div class="input-group">
                <label for="depthOfCut">Depth of Cut (mm)</label>
                <input
                    type="number"
                    id="depthOfCut"
                    placeholder="Example: 2"
                >
            </div>

            <div class="input-group">
                <label for="mrrFeedRate">Feed Rate (mm/min)</label>
                <input
                    type="number"
                    id="mrrFeedRate"
                    placeholder="Example: 320"
                >
            </div>

            <button onclick="calculateMRR()">
                Calculate
            </button>

            <div class="result">
                <span>Material Removal Rate:</span>
                <strong id="mrrResult">---</strong>
            </div>

        </section>

    </main>


    <footer>
        <p>Developed by Li Lu | Machining Development Engineer</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
